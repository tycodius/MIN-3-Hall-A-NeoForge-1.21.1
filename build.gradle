plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
repositories {
    maven { url = 'https://maven.blamejared.com' }
}
dependencies {
    // JEI is optional at runtime; never force it onto a dedicated server.
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.51.0.418'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.51.0.418'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources).configure {
    def replacements = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                        mod_authors: mod_authors, mod_license: mod_license,
                        mod_description: mod_description]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
}

// Retain a copy of the original GPL license in distributed JARs.
tasks.named('jar', Jar) {
    from('LICENSE') { into('META-INF') }
}
